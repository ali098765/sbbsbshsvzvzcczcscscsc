on:
  workflow_dispatch:

jobs:
  fast-media-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: System Optimization & Fast Desktop Setup
        run: |
          sudo apt-get update
          # تثبيت واجهة XFCE خفيفة + تشغيل الصوت PulseAudio (لكي تسمع الصوت بوضوح) + المتصفح
          sudo apt-get install -y xfce4 xfce4-goodies pulseaudio xrdp wget curl
          
          # تحميل وتثبيت Google Chrome الأصلي (الأفضل لتشغيل الفيديوهات بدقة عالية)
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          rm google-chrome-stable_current_amd64.deb

          # إعدادات الصوت والاتصال لضمان عدم تقطيع الصوت أو الصورة
          sudo systemctl enable xrdp
          echo "startxfce4" > ~/.xsession
          sudo sed -i 's/port=3389/port=3389/g' /etc/xrdp/xrdp.ini
          sudo systemctl restart xrdp

      - name: Create Media User
        run: |
          sudo useradd -m -s /bin/bash mediauser
          echo "mediauser:MR.English2008" | sudo chpasswd
          sudo usermod -aG sudo mediauser
          sudo usermod -aG audio,video mediauser

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect Tailscale
        run: |
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=media-streamer-$GITHUB_RUN_ID
          
          tsIP=""
          while [ -z "$tsIP" ]; do
              tsIP=$(tailscale ip -4)
              sleep 2
          done
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV || echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Show Connection Info
        run: |
          echo "===================================="
          echo "🚀 Ultra-Fast Media Server is Ready!"
          echo "📍 Tailscale IP: $TAILSCALE_IP"
          echo "👤 User: mediauser"
          echo "🔑 Password: MR.English2008"
          echo "🌐 Browser: Google Chrome (Optimized for Video)"
          echo "===================================="
          while true; do
              sleep 300
          done
          
